<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b12" />
  <title>LunaClock</title>
  <style>
    :root{
      --bg1:#05050a; --bg2:#0b0b12; --card:rgba(255,255,255,.06);
      --text:#f5f1ff; --muted:#c8c2d8; --accent:#c6a7ff; --accent2:#7aa7ff;
      --line:rgba(255,255,255,.10);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top, rgba(198,167,255,.18), transparent 35%),
        radial-gradient(circle at bottom, rgba(122,167,255,.14), transparent 30%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
      overflow:hidden;
    }
    .stars, .stars:before, .stars:after{
      position:absolute; inset:0; content:""; pointer-events:none;
      background-image:
        radial-gradient(1px 1px at 20px 30px, #fff 99%, transparent),
        radial-gradient(1px 1px at 80px 120px, #fff 99%, transparent),
        radial-gradient(1px 1px at 160px 60px, #fff 99%, transparent),
        radial-gradient(1px 1px at 240px 180px, #fff 99%, transparent);
      background-size:260px 220px;
      opacity:.45; animation: drift 18s linear infinite;
    }
    .stars:before{opacity:.25; animation-duration:28s}
    .stars:after{opacity:.15; animation-duration:40s}
    @keyframes drift{from{transform:translateY(0)}to{transform:translateY(-220px)}}
    .wrap{
      min-height:100%;
      display:grid;
      place-items:center;
      padding:24px;
      position:relative;
      z-index:1;
    }
    .card{
      width:min(92vw,420px);
      padding:34px 28px;
      border:1px solid var(--line);
      border-radius:28px;
      background:var(--card);
      backdrop-filter: blur(18px);
      box-shadow:0 20px 60px rgba(0,0,0,.45);
      text-align:center;
    }
    .logo{
      width:84px; height:84px; margin:0 auto 18px;
      border-radius:24px;
      background: linear-gradient(135deg, rgba(198,167,255,.35), rgba(122,167,255,.22));
      border:1px solid rgba(255,255,255,.14);
      display:grid; place-items:center;
      font-size:34px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
    }
    h1{margin:0 0 10px; font-size:40px; letter-spacing:.5px}
    p{margin:0; color:var(--muted); font-size:16px; line-height:1.8}
    .btn{
      display:inline-block; margin-top:22px;
      padding:12px 18px; border-radius:999px;
      text-decoration:none; color:#111;
      background:linear-gradient(135deg,var(--accent),#ffffff);
      font-weight:700;
      box-shadow:0 10px 30px rgba(198,167,255,.25);
    }
    .small{margin-top:14px; font-size:12px; opacity:.75}
  </style>
</head>
<body>
  <div class="stars"></div>
  <main class="wrap">
    <section class="card">
      <div class="logo">🌙</div>
      <h1>LunaClock</h1>
      <p>ساعة أنيقة، منبّه هادئ، وتصميم ليلي مريح.</p>
      <a class="btn" href="#">ابدأ الآن</a>
      <div class="small">GitHub Pages Ready</div>
    </section>
  </main>
</body>
</html>
